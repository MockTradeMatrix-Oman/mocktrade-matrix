<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="MockTrade Matrix — Simulate, Learn, Earn">
  <defs>
    <linearGradient id="mark" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4cf0b4"/>
      <stop offset="1" stop-color="#14a874"/>
    </linearGradient>
    <linearGradient id="markLine" x1="8" y1="28" x2="32" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04140d"/>
      <stop offset="1" stop-color="#0a3527"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2fe3a0"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2fe3a0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2fe3a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2fe3a0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4cf0b4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.12" r="0.75">
      <stop stop-color="#2fe3a0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2fe3a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="0.95" r="0.6">
      <stop stop-color="#8b7bff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="#06080d"/>
  <rect width="1600" height="520" fill="url(#grid)"/>
  <rect width="1600" height="520" fill="url(#glow)"/>
  <rect width="1600" height="520" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1599" height="519" fill="none" stroke="#1a2230"/>

  <!-- market line motif -->
  <g opacity="0.95">
    <path d="M905 372 L978 330 L1042 348 L1108 288 L1172 306 L1240 236 L1306 258 L1372 196 L1440 214 L1512 150 L1512 402 L905 402 Z" fill="url(#area)"/>
    <path d="M905 372 L978 330 L1042 348 L1108 288 L1172 306 L1240 236 L1306 258 L1372 196 L1440 214 L1512 150" fill="none" stroke="url(#stroke)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M905 372 L978 330 L1042 348 L1108 288 L1172 306 L1240 236 L1306 258 L1372 196 L1440 214 L1512 150" fill="none" stroke="#4cf0b4" stroke-width="1" stroke-opacity="0.5" filter="url(#soft)"/>
    <circle cx="1512" cy="150" r="7" fill="#4cf0b4"/>
    <circle cx="1512" cy="150" r="14" fill="none" stroke="#4cf0b4" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="1240" cy="236" r="4.5" fill="#06080d" stroke="#2fe3a0" stroke-width="2.5"/>
    <circle cx="1108" cy="288" r="4.5" fill="#06080d" stroke="#2fe3a0" stroke-width="2.5"/>
  </g>

  <!-- highlight chip -->
  <g transform="translate(1270 84)">
    <rect width="250" height="46" rx="23" fill="#0f1521" stroke="#1a2230"/>
    <circle cx="26" cy="23" r="5" fill="#2fe3a0"/>
    <text x="44" y="29" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="2.4" fill="#c8d3e4">ZERO REAL MONEY</text>
  </g>

  <!-- logo mark -->
  <g transform="translate(100 202) scale(2.9)">
    <rect width="40" height="40" rx="12" fill="url(#mark)"/>
    <rect x="0.6" y="0.6" width="38.8" height="38.8" rx="11.4" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2"/>
    <path d="M9 29.5V15L20 23.5L31 11.5V29.5" fill="none" stroke="#04140d" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="31" cy="11.5" r="2.3" fill="#04140d"/>
  </g>

  <!-- wordmark -->
  <text x="252" y="266" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="76" font-weight="650" letter-spacing="-1.6">
    <tspan fill="#eef2f8">MockTrade</tspan>
    <tspan fill="#2fe3a0" dx="16">Matrix</tspan>
  </text>

  <text x="254" y="306" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="7.5" fill="#8a94a8">SIMULATE · LEARN · EARN</text>

  <rect x="254" y="330" width="72" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="254" y="371" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="20" fill="#9aa6ba">Global skill-based 1v1 arena · Region-wise leaderboards</text>
  <text x="254" y="402" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="20" fill="#9aa6ba">Real-time markets · Guardian-verified identity</text>

  <!-- footer -->
  <g transform="translate(100 452)">
    <rect x="-1" y="-1" width="1400" height="1.5" fill="#1a2230"/>
  </g>
  <text x="100" y="492" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="15" letter-spacing="1.2" fill="#5f6b80">MOCKTRADEMATRIX</text>
  <text x="1500" y="492" text-anchor="end" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="15" letter-spacing="1.2" fill="#5f6b80">MIDDLE EAST · INDIA</text>
</svg>
