services:
  - type: web
    name: mocktrade-matrix
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Free instances have an ephemeral disk: the SQLite file is restored from
      # and uploaded to object storage (see lib/backup.mjs). Set both in the
      # Render dashboard; never commit them.
      - key: BACKUP_URL
        sync: false
      - key: BACKUP_TOKEN
        sync: false
      - key: BACKUP_APIKEY
        sync: false
      - key: BACKUP_INTERVAL_MS
        value: "300000"
      # Guardian consent email. Render free blocks SMTP ports, so set a Brevo
      # API key (HTTPS, 300/day free). APP_URL makes the emailed link point at
      # the public site.
      - key: APP_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "MockTrade Matrix <mocktradematrix@gmail.com>"
      - key: MAIL_REPLY_TO
        value: mocktradematrix@gmail.com
